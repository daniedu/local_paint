<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="Drawing app with brushes, layers, and multiplayer" />
  <title>Drawing App</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#1a1a2e',
            'surface-2': '#222240',
            primary: '#7c5cfc',
            accent: '#ff6b9d',
            'text-dim': '#8888aa',
            border: '#2a2a4a',
          }
        }
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #canvas-container { touch-action: none; position: relative; overflow: hidden; cursor: crosshair; }
    #canvas-container.pan-mode { cursor: grab; }
    #canvas-container.pan-mode:active { cursor: grabbing; }
    #display-canvas { position: absolute; top: 0; left: 0; image-rendering: pixelated; }
    #preview-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .layer-thumb { width: 48px; height: 36px; object-fit: cover; border-radius: 4px; }
    .tool-btn { @apply w-10 h-10 flex items-center justify-center rounded-lg transition-colors text-lg; }
    .tool-btn.active { @apply bg-primary text-white; }
    .tool-btn:not(.active) { @apply text-text-dim hover:text-white hover:bg-surface-2; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
    @media (max-width: 768px) {
      #sidebar { display: none; }
      #bottom-bar { display: flex !important; }
    }
    @media (min-width: 769px) {
      #sidebar { display: flex; }
      #bottom-bar { display: none !important; }
    }
  </style>
</head>
<body class="bg-[#0f0f1a] text-white h-screen flex flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-2 bg-surface border-b border-border shrink-0">
    <h1 class="text-lg font-bold bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">Drawing App</h1>
    <div class="flex items-center gap-2">
      <button id="fullscreen-btn" class="text-text-dim hover:text-white text-lg p-1" title="Fullscreen">⛶</button>
      <button id="grid-btn" class="text-text-dim hover:text-white text-lg p-1" title="Grid">▦</button>
      <button id="save-btn" class="text-text-dim hover:text-white text-lg p-1" title="Save to gallery">💾</button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar (desktop) -->
    <aside id="sidebar" class="w-14 flex-col bg-surface border-r border-border py-2 items-center gap-1 shrink-0">
      <button class="tool-btn active" data-tool="pen" title="Pen">✏️</button>
      <button class="tool-btn" data-tool="marker" title="Marker">🖍️</button>
      <button class="tool-btn" data-tool="spray" title="Spray">💨</button>
      <button class="tool-btn" data-tool="calligraphy" title="Calligraphy">🖊️</button>
      <button class="tool-btn" data-tool="airbrush" title="Airbrush">🎨</button>
      <div class="w-8 h-px bg-border my-1"></div>
      <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
      <button class="tool-btn" data-tool="pan" title="Pan/Zoom">✋</button>
      <button class="tool-btn" data-tool="fill" title="Fill">🪣</button>
      <button class="tool-btn" data-tool="rect" title="Rectangle">⬜</button>
      <button class="tool-btn" data-tool="circle" title="Circle">⭕</button>
      <button class="tool-btn" data-tool="text" title="Text">🔤</button>
    </aside>

    <!-- Canvas -->
    <main class="flex-1 relative bg-[#0a0a14]" id="canvas-container">
      <canvas id="display-canvas"></canvas>
      <canvas id="preview-canvas"></canvas>
    </main>

    <!-- Layer panel (desktop right) -->
    <aside id="layer-panel" class="w-56 flex-col bg-surface border-l border-border p-2 gap-1 shrink-0 hidden md:flex">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold text-text-dim uppercase">Layers</span>
        <button id="add-layer-btn" class="text-text-dim hover:text-white text-sm">+</button>
      </div>
      <div id="layer-list" class="flex-1 overflow-y-auto scrollbar-thin space-y-1"></div>
    </aside>
  </div>

  <!-- Bottom bar (mobile) -->
  <div id="bottom-bar" class="flex-col bg-surface border-t border-border">
    <div class="flex items-center gap-1 px-2 py-1 overflow-x-auto scrollbar-thin">
      <button class="tool-btn active shrink-0" data-tool="pen">✏️</button>
      <button class="tool-btn shrink-0" data-tool="marker">🖍️</button>
      <button class="tool-btn shrink-0" data-tool="spray">💨</button>
      <button class="tool-btn shrink-0" data-tool="calligraphy">🖊️</button>
      <button class="tool-btn shrink-0" data-tool="airbrush">🎨</button>
      <button class="tool-btn shrink-0" data-tool="eraser">🧹</button>
      <button class="tool-btn shrink-0" data-tool="pan">✋</button>
      <button class="tool-btn shrink-0" data-tool="fill">🪣</button>
      <button class="tool-btn shrink-0" data-tool="rect">⬜</button>
      <button class="tool-btn shrink-0" data-tool="circle">⭕</button>
      <button class="tool-btn shrink-0" data-tool="text">🔤</button>
    </div>
    <div class="flex items-center gap-3 px-3 py-1.5 text-xs">
      <label class="flex items-center gap-1 text-text-dim">
        <span>Color</span>
        <input type="color" id="color-picker" value="#7c5cfc" class="w-7 h-7 border border-border rounded cursor-pointer bg-transparent" />
      </label>
      <label class="flex items-center gap-1 text-text-dim">
        <span>Size</span>
        <input type="range" id="size-slider" min="1" max="50" value="4" class="w-16 accent-primary" />
        <span id="size-display" class="w-4 h-4 rounded-full bg-white inline-block"></span>
      </label>
      <label class="flex items-center gap-1 text-text-dim">
        <span>Opacity</span>
        <input type="range" id="opacity-slider" min="5" max="100" value="100" class="w-16 accent-primary" />
      </label>
      <button id="undo-btn" class="text-text-dim hover:text-white text-sm px-2 py-1 rounded hover:bg-surface-2">Undo</button>
      <button id="redo-btn" class="text-text-dim hover:text-white text-sm px-2 py-1 rounded hover:bg-surface-2">Redo</button>
      <button id="clear-btn" class="text-text-dim hover:text-white text-sm px-2 py-1 rounded hover:bg-surface-2">Clear</button>
      <button id="layers-toggle-btn" class="text-text-dim hover:text-white text-sm px-2 py-1 rounded hover:bg-surface-2 md:hidden">Layers</button>
    </div>
  </div>

  <!-- Layer bottom sheet (mobile) -->
  <div id="layer-sheet" class="fixed inset-x-0 bottom-0 bg-surface border-t border-border p-3 z-50 hidden translate-y-full transition-transform">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-semibold text-text-dim uppercase">Layers</span>
      <button id="close-layer-sheet" class="text-text-dim hover:text-white">✕</button>
    </div>
    <div id="layer-list-mobile" class="space-y-1 max-h-48 overflow-y-auto"></div>
    <button id="add-layer-btn-mobile" class="mt-2 w-full py-1.5 text-sm bg-surface-2 rounded-lg hover:bg-primary transition-colors">+ Add Layer</button>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-surface-2 text-white px-4 py-2 rounded-lg border border-border text-sm opacity-0 transition-opacity pointer-events-none z-50"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
